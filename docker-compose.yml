services:
  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fitbase_frontend
    ports:
      - "${FRONTEND_PORT:-20080}:80"
    volumes:
      - ./:/app
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    environment:
      - YII_DEBUG=${YII_DEBUG:-true}
      - YII_ENV=${YII_ENV:-dev}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-fitbase}
      - DB_USERNAME=${DB_USERNAME:-fitbase}
      - DB_PASSWORD=${DB_PASSWORD:-fitbasePwd123}
    depends_on:
      - mysql
    restart: always
    networks:
      - fitbase-network

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: fitbase_backend
    ports:
      - "${BACKEND_PORT:-21080}:80"
    volumes:
      - ./:/app
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    environment:
      - YII_DEBUG=${YII_DEBUG:-true}
      - YII_ENV=${YII_ENV:-dev}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-fitbase}
      - DB_USERNAME=${DB_USERNAME:-fitbase}
      - DB_PASSWORD=${DB_PASSWORD:-fitbasePwd123}
    depends_on:
      - mysql
    restart: always
    networks:
      - fitbase-network

  mysql:
    image: mysql:8.0
    platform: linux/arm64/v8
    container_name: fitbase_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-fitbasePwd123}
      - MYSQL_DATABASE=${DB_DATABASE:-fitbase}
      - MYSQL_USER=${DB_USERNAME:-fitbase}
      - MYSQL_PASSWORD=${DB_PASSWORD:-fitbasePwd123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    restart: always
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - fitbase-network

networks:
  fitbase-network:
    driver: bridge

volumes:
  mysql_data: